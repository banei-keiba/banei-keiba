name: オッズのバックフィル

# 過去分の確定オッズを少しずつ埋める。2026-08 時点で未取得が約 25,000 レースある。
#
# 1 回あたりを小さく刻む。2026-08-06 に 3,000 件で回したところ、1,400 件を過ぎた
# あたりから相手サイトが 500 を返し続けるようになり、実行が中断されて
# 取得済み分がまるごと失われた。刻みを小さくすれば失う量も小さくなる。
# 間隔も 1 秒より広げて、拒否されにくくする。
#
# 日次収集と DB を共有するため concurrency group を揃えて直列化する。
# 手動実行のみ。日次が安定してから schedule を足すか判断する。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "1 回で取得するレース数の上限"
        required: false
        default: "1000"
      interval:
        description: "リクエスト間隔（秒）"
        required: false
        default: "2.0"

concurrency:
  group: daily-ingest
  cancel-in-progress: false

env:
  BACKUP_REPO: banei-keiba/banei-db-backup

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync

      - name: バックアップから DB を復元
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          mkdir -p data
          gh release download latest --repo "$BACKUP_REPO" --dir data
          gunzip data/banei.db.gz data/odds.db.gz

      - name: 未取得件数を表示
        run: |
          sqlite3 data/odds.db "ATTACH 'data/banei.db' AS b;
            SELECT '未取得 ' ||
              ((SELECT COUNT(*) FROM b.races) - (SELECT COUNT(*) FROM odds_meta)) || ' レース';"

      # 連続で失敗したらスクレイパー側が自分で中断し、正常終了する。
      # そのあとの検証とバックアップが走るので、そこまでの成果は保存される。
      - name: オッズを取得
        env:
          LIMIT: ${{ inputs.limit }}
          INTERVAL: ${{ inputs.interval }}
        run: uv run banei odds --limit "$LIMIT" --interval "$INTERVAL"

      - name: 検証
        run: uv run banei validate

      - name: バックアップ
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: ./scripts/backup-db.sh
