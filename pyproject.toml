[project]
name = "banei"
version = "0.1.0"
description = "ばんえい競馬（帯広）のデータ収集・分析"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# 収集だけなら不要な重い依存。CI の日次スクレイプは ml を入れずに回す。
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pyarrow>=17",
]

[project.scripts]
banei = "banei.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banei"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
