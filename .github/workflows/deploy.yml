name: サイトを公開

# 日次収集からも呼べるように workflow_call を持たせている。
# 集計 JSON が更新されたらサイトも作り直す必要があるため。
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  PAGES_PROJECT: banei-keiba

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx astro telemetry disable
        working-directory: web

      - run: npm run build
        working-directory: web

      # 生データが公開物に混ざっていないことを、デプロイ直前にもう一度確かめる。
      # export 側でも検査しているが、ここが最後の関門になる。
      - name: 公開物に生データが無いことを確認
        run: |
          if grep -rlE '"(race_date|horse_no|horse_id)"' web/dist; then
            echo "生データらしきキーが公開物に含まれている" >&2
            exit 1
          fi
          echo "ok"

      - name: Cloudflare Pages へ配信
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: web
        run: |
          # 初回はプロジェクトが無いので作る。既にあればそのまま進む。
          npx wrangler pages project create "$PAGES_PROJECT" \
            --production-branch main 2>/dev/null || true
          npx wrangler pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main
